ReleaseNotes: |-
  [1.136.116] - 2026-11-05
  On Windows Update, Cancel stops a PSWindowsUpdate install or check that is stuck, and the Dashboard's update check no longer writes into the tab's console.
  Fixed
  - Cancel and Escape did nothing while Windows Update checked for or installed the PSWindowsUpdate module, which the
    History view uses. They stopped only what an earlier list or history had left running, so an install held up by a
    slow or blocked PowerShell Gallery kept the tab busy, with its other buttons off, until it gave up. They stop the
    check and the install now. Since the tab first shipped, in 0.3.0.
  - The Dashboard's Check Windows Updates wrote its "Connecting to Windows Update…" and "Found N update(s)." lines
    into the Windows Update tab's console, in the middle of an install log if one was running. A check or an install
    now writes only into the console of the tab that started it. Since the Dashboard's check first ran a real scan, in
    1.114.0.
  Removed
  - The Windows Update table's Visibility binding, which never worked: its converter returned a bool where WPF needs
    a Visibility, so WPF refused the value and the table was always shown, as it still is. The converter,
    IntGreaterThanZeroConverter, was used nowhere else and went with it. A test now fails any Visibility binding
    whose converter returns something other than a Visibility.
  Verify the download
  Get-FileHash .\SysManager-v1.136.116.exe -Algorithm SHA256
  Expected SHA256: 5801C4FBD48DA3CF2C3C6C451D71EBFA665632FADABF78286D71789FFA5D7A79
  This build is not code-signed, so Windows will warn on first launch. That is
  expected for a small independent app: see what the warning says and what to
  click.
  Code signing is planned through the SignPath Foundation,
  which provides free certificates to open-source projects, with signing performed by
  SignPath.io. Until then, the SHA256 above and the build
  attestation below are what establish that a download is the genuine build.
  Code signing policy
  This release is not code-signed. The team roles, release-approval process and
  privacy policy required by the SignPath Foundation programme
  are documented in advance under Code signing
  policy. That
  documentation is a prerequisite for applying, not evidence of a certificate. The
  attribution line naming SignPath as the signing provider will appear here once a
  certificate is actually issued.
  This program will not transfer any information to other networked systems unless
  specifically requested by the user or the person installing or operating it. Two checks
  run on their own when SysManager starts: the version check against the GitHub Releases
  API, at most once a day, and the Dashboard's app-updates alert, which asks winget. The
  About tab can switch off either. Everything else that uses the network runs only when you
  use it. Full
  privacy policy.
  Verify where this binary came from
  This exe was built by GitHub Actions from this public source, and the build is
  recorded in the Sigstore public transparency log. With the
  GitHub CLI:
  gh attestation verify .\SysManager-v1.136.116.exe --repo laurentiu021/SystemManager
  That proves which commit and workflow produced this exact binary, something the
  SHA256 file cannot show, since it is published alongside the exe it describes.
  Each release also ships SysManager-v1.136.116.sbom.json, a CycloneDX inventory of
